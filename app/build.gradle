plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cleantv.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.cleantv.launcher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// No external dependencies on purpose: plain Android framework views only.
